# Intake detection (task-078, plan-065): once a day and by hand, the wingfoil versions published on
# npm and missing from compat.yaml. A missing version ends the run red, with an ::error naming it,
# every day until an intake records it (plan-065 point 5). Read-only: no token, no cache, no push.
name: Intake

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

# One group per ref, never cancelling a running check: GitHub keeps one running and one pending
# run, enough for a daily schedule.
concurrency:
  group: intake-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.21.0'
          check-latest: false
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Detect the wingfoil versions missing from compat.yaml
        run: npm run -s intake:detect -- --github
