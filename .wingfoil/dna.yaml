# Project DNA (P2.4) — scaffolded by `wingfoil init` (Kanban template), then customized for this
# repository. Structural map of the project: modules, stacks, team + roles, resource paths.
version: 3

project:
  name: wingfoil-templates
  description: >-
    The official, live source of WingFoil template packs: methodologies, team-mode overlays, phase
    methods, project blueprints and lifecycle stages, with the transitions between stages. The
    WingFoil CLI downloads them at init, pack add, upgrade and stage set; its npm package bundles the
    base packs as offline fallback.
  license: MIT
  repository: https://github.com/wingfoil/wingfoil-templates
  methodology: Kanban        # Continuous flow: every pack is semver'd and released on its own, no timeboxed iterations.
  north_star: >-
    Every pack combination composes deterministically (same packs, versions and parameters give
    byte-identical files) into a .wingfoil/ configuration that every released WingFoil compatible
    with the packs' formats and capabilities validates with zero errors.

# Modules — the parts of this repository.
modules:
  - name: catalog
    description: "catalog.yaml: the index WingFoil reads — every pack, its axis, path, published versions and their digests."
    path: catalog.yaml
  - name: schema
    description: "JSON Schemas of pack.yaml, catalog.yaml, presets and transitions (the contract with the WingFoil CLI)."
    path: schema
  - name: packs
    description: "One directory per pack: base, then grouped by axis: methodology, phase/<slot>, blueprint, governance, team-mode, stage."
    path: packs
  - name: transitions
    description: "Stage transitions run by `wingfoil stage set`: pre-checks, actions, the decision-log they record."
    path: transitions
  - name: presets
    description: "Named, curated pack combinations selectable with `wingfoil init --preset`."
    path: presets
  - name: compat
    description: "compat.yaml: per WingFoil release, the file formats it reads and the capabilities it provides (dl-002)."
    path: compat.yaml
  - name: tooling
    description: "The reference composer and the validation command (adr-001, adr-002), TypeScript compiled with tsc."
    path: src

# Stacks — technologies + methodologies in use.
stacks:
  technologies:
    - name: YAML
      category: format
      notes: "pack.yaml, fragments, workflows, catalog, presets, transitions"
    - name: Markdown
      category: format
      notes: "directives, Memory templates, pack READMEs"
    - name: JSON Schema
      category: specification
      version: "2020-12"
    - name: WingFoil CLI
      category: tool
      version: "0.2.2"
      notes: "manages this repository (package.json devDependency, pinned exact) and validates composed packs"
    - name: Node.js
      category: runtime
      version: ">=22.12"
    - name: TypeScript
      category: language
      version: "6.0.3"
      notes: "the repository tooling, compiled with tsc (adr-002)"
    - name: yaml
      category: library
      version: "2.9.1"
      notes: "YAML parsing with source text and deterministic output (adr-003)"
    - name: ajv
      category: library
      version: "8.20.0"
      notes: "JSON Schema 2020-12 validation against schema/ (adr-003)"
    - name: semver
      category: library
      version: "7.8.5"
      notes: "version comparison and range evaluation, behind the spec-001 §6.3 subset parser (adr-003)"
  methodologies:
    - name: Kanban
    - name: Semantic Versioning
      notes: "per pack, never repository-wide (dl-001); the rules are the pack-semver directive"

# Team & roles — AI agents execute as non-approving roles and never hold approval authority.
team:
  members:
    - name: Roberto Pompermaier
      email: robypomper@gmail.com
      roles: [approver, product-owner, tech-lead]
  agents:
    - name: claude
      executes_as: [pack-author, developer, reviewer, architect, facilitator]
      approval_authority: false
  roles:
    - name: pack-author
      description: "Writes and changes pack content: pack.yaml, fragments, directives, workflows, Memory templates."
    - name: developer
      description: "Writes the repository tooling: composition and validation scripts, CI."
    - name: reviewer
      description: "Reviews a change against the directives; judges independently of its author."
    - name: architect
      description: "Owns the pack model, the schemas and the contract with the WingFoil CLI."
    - name: product-owner
      description: "Owns the catalog scope: which packs exist, in which order they are built."
    - name: tech-lead
      description: "Owns pack releases and compat.yaml: the bump class, the formats and capabilities, the maintained lines, the publication."
    - name: facilitator
      description: "Runs the capture workflows (bugs, decision logs, ADRs) and the WingFoil feedback inbox."
    - name: approver
      description: "The human gate: accepts packs, tasks, decisions and every publication."

# Resource paths — query categories used to navigate the project.
paths:
  sources: [catalog.yaml, compat.yaml, schema, packs, transitions, presets, src]
  tests: [tests]
  docs: [README.md, docs]
  config: [.wingfoil, package.json]
  governance: [docs/memory, docs/plans, docs/retrospectives, docs/wingfoil-feedback, LICENSE]
