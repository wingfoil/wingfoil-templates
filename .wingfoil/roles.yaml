# Directive role assignments (P3.2/P3.7) — scaffolded by `wingfoil init`, then customized.
# Binds directives to roles by directive ID, independent of the built-in/custom subfolder holding the file.
version: 2

assignments:
  pack-author:
    - pack-authoring
    - pack-semver
    - determinism
  developer:
    - code-quality
    - testing
    - determinism
  reviewer:
    - code-review
    - pack-authoring
    - pack-semver
    - pack-compatibility
    - traceability
  architect:
    - architecture
    - pack-authoring
    - determinism
    - traceability
  product-owner:
    - traceability
  tech-lead:
    - architecture
    - code-review
    - pack-semver
    - pack-compatibility
  facilitator:
    - traceability

# Global directives apply to every role.
global:
  - doc-versioning
  - documentation
  - security
  - security-secrets
  - wingfoil-cli
