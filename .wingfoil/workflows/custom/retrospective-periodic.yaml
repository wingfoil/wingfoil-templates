# Startable entry point for the periodic retrospective (dl-006 R1, R3): the work between packs (pack
# releases, tooling, governance). Run at least once between two WingFoil releases, before WingFoil's
# release planning, so that WingFoil-side points reach the feedback notes in time (dl-001 D6); also
# after any pack-deprecation. Started at the close of every wingfoil-release-intake, by its phase
# retrospective-start (dl-029 T1), unless one has closed since the release taken in; a pack-cycle
# retrospective counts as the periodic one when its inventory has the scope "periodic" (dl-029
# Option 3). A main cannot be included, so this thin main includes the sub.
name: retrospective-periodic
kind: main
description: "Periodic retrospective of the work between packs"
version: 2
phases:
  - name: retrospective
    description: "One retrospective over the period since the previous one."
    include: retrospective
