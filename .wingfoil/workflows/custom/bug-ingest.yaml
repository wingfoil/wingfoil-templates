# Startable entry point to capture one defect of a pack or of this repository's tooling.
# A defect of WingFoil itself goes to docs/wingfoil-feedback/ instead (wingfoil-feedback directive).
name: bug-ingest
kind: main
description: "Capture a defect of a pack or of the repository tooling into Memory."
version: 1
phases:
  - name: capture
    description: "Record the bug (observed, expected, reproduction, severity, pack)."
    role: facilitator
    actions:
      - 'memory.add(type: bug)'
      - memory.submit            # draft → pending
    produces:
      - "docs/memory/bug/{id}.md"
    checks:
      post: ["frontmatter.required: [title, severity]"]
  - name: triage
    description: "The approver accepts the bug (pending → approved) or sends it back to capture."
    role: tech-lead
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: capture }
