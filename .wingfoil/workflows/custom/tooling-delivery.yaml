# Tooling delivery loop (sub-workflow), one iteration per tooling `task` element (a task whose
# `pack` is empty). Included by sw-life-cycle › tooling and by tooling-change (dl-005 G7).
# The same loop as kanban-delivery, which serves pack tasks: same phases, states, gates and WIP
# limits, with the developer role where kanban-delivery has pack-author (bug-001). The two files
# differ only in roles and descriptions; a change to one is checked against the other.
# WIP limits: at most 1 tooling task in-progress and 1 in-review. Not enforced by WingFoil (no
# workflow engine): the plan phase checks them with
# `npx wingfoil memory search --type task --status in-progress`.
# Task machine (memory.yaml): draft → pending (gate) → backlog → in-progress → in-review (gate) →
# approved → done.
name: tooling-delivery
kind: sub
description: "Tooling delivery loop"
version: 2
element: task
phases:
  - name: plan
    description: >-
      Pick the next tooling work within the WIP limits; create the task (empty pack, Context citing
      the feature, spec or ADR it comes from, Acceptance with the commands); an independent review
      of the body, amended while pending (dl-017); submit it; the approver accepts it into the
      backlog or rejects it.
    role: product-owner
    actions:
      - 'memory.add(type: task)'
      - memory.submit            # draft → pending
      - memory.approve           # pending → backlog (approver)
    approval: { by_role: approver }
  - name: design
    description: >-
      Write the Design section, listing the red steps of the work; a Design that cannot list them
      proposes a split, through plan, before in-progress (dl-018). An Acceptance criterion that
      cannot hold as written goes to the approver when found, and the work on it waits for the
      ruling (dl-019). Open branch task/<id>, start the task (backlog → in-progress).
    role: developer
    actions:
      - memory.submit            # backlog → in-progress
  - name: build
    description: >-
      Write the tooling (code-quality, testing, determinism), test first: the Execution Notes
      record each red run (command and failing count); a test written after the change only for
      third-party tool configuration or content, checked by mutation (dl-018). An Acceptance
      criterion that cannot hold goes to the approver when found (dl-019). The build, the tests and
      the Acceptance commands pass before review.
    role: developer
  - name: review
    description: >-
      An independent review of the build against the reviewer's directives and the developer's
      (code-quality, testing), red first included (dl-018); the Acceptance commands pass; an
      Acceptance deviation with no ruling is a blocking finding (dl-019). After its fixes, a
      re-review when a fix changes behaviour, a test or an Acceptance command; the notes record
      each verdict, its findings by severity and the fixing commit (dl-017). Then in-progress →
      in-review; the approver accepts (→ approved) or sends it back (→ in-progress).
    role: reviewer
    actions:
      - memory.submit            # in-progress → in-review
      - memory.approve           # in-review → approved (approver)
    approval: { by_role: approver }
    fallback: { step: build, set_state: in-progress }
  - name: deliver
    description: "Merge task/<id> into main with --no-ff, then approved → done."
    role: developer
    actions:
      - memory.submit            # approved → done
