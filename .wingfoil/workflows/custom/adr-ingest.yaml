# Startable entry point to capture one architecture decision (pack model, schemas, catalog, tooling).
name: adr-ingest
kind: main
description: "Capture an architecture decision record into Memory."
version: 3
phases:
  - name: capture
    description: >-
      Record the context, the decision and its consequences; an independent review, amended while
      pending, its record (dl-017 R3) the verdict, the count per severity, the fixing commit and
      what was applied, or not and why.
    role: architect
    actions:
      - 'memory.add(type: adr)'
      - memory.submit            # draft → pending
    produces:
      - "docs/memory/adr/{id}.md"
  - name: approve
    description: "The approver accepts the ADR (pending → approved) or sends it back."
    role: architect
    actions:
      - memory.approve
    approval: { by_role: approver }
    fallback: { step: capture }
