# Publish one version of one pack (sub-workflow). Included by pack-cycle (first release) and by the
# pack-release main (every later release).
# pack-release machine (memory.yaml): draft → validating → releasing (gate) → released.
name: pack-release-cycle
kind: sub
description: "Classify, validate, approve and publish one pack version"
version: 4
element: pack-release
phases:
  - name: prepare
    description: >-
      Classify every change since the previous version (pack-semver), compute the bump, set
      version, formats and requires_capabilities in pack.yaml, compute the WingFoil range from
      compat.yaml (dl-002), write the CHANGELOG.md entry. Check the README's "Install and update"
      section against compat.yaml (spec-002 §2.3, CB-3). On an N-1 maintenance line (after
      WingFoil 1.0) only fixes are accepted.
    role: tech-lead
    actions:
      - 'memory.add(type: pack-release)'
      - memory.submit            # draft → validating
    produces:
      - "docs/memory/pack-release/{id}.md"
      - "packs/**/CHANGELOG.md"
    checks:
      post: ["frontmatter.required: [pack, version, bump, wingfoil]"]
  - name: validate
    description: >-
      The compatibility matrix (pack-compatibility): compose every preset and every documented
      combination that includes the pack, with the oldest and the newest released WingFoil that
      compat.yaml lists as compatible; each must validate with zero errors, and two compositions
      must be byte-identical.
      Record commands and exit codes in the Validation section.
    role: reviewer
    actions:
      - memory.submit            # validating → releasing
    checks:
      post: ["Validation section lists every WingFoil version and preset with exit code 0"]
  - name: approve-publication
    description: "The approver authorizes the publication (releasing → released) or sends it back."
    role: tech-lead
    actions:
      - memory.approve           # releasing → released (approver)
    approval: { by_role: approver }
    fallback: { step: validate, set_state: validating }
  - name: publish
    description: >-
      Tag <catalog pack id>@<version> at the release commit (dl-004, spec-001 §11); then, in one
      later commit, update catalog.yaml (version, commit, digest, formats, capabilities, computed
      WingFoil range) and regenerate CATALOG.md and catalog-index.json with npm run index
      (spec-002 §3); no file under packs/ changes. Push the tag and the commit.
      Until npm run index exists (wave W14), the regeneration is skipped and recorded as skipped
      in the pack-release element's Execution Notes (plan-023).
      If WingFoil bundles the pack, add a note to docs/wingfoil-feedback/ for WingFoil's
      advance-bundled-packs release step.
    role: tech-lead
    produces:
      - "catalog.yaml"
      - "CATALOG.md"
      - "catalog-index.json"
