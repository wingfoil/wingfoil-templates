# Publish one version of one pack (sub-workflow). Included by pack-cycle (first release) and by the
# pack-release main (every later release).
# pack-release machine (memory.yaml): draft → validating → releasing (gate) → released.
name: pack-release-cycle
kind: sub
description: "Classify, validate, approve and publish one pack version"
version: 10
element: pack-release
phases:
  - name: prepare
    description: >-
      Classify every change since the previous version (pack-semver), compute the bump, set
      version, formats and requires_capabilities in pack.yaml, compute the WingFoil range from
      compat.yaml (dl-002), write the CHANGELOG.md entry. Check the README's "Install and update"
      section against compat.yaml (spec-002 §2.3, CB-3). On an N-1 maintenance line (after
      WingFoil 1.0) only fixes are accepted.
    role: tech-lead
    actions:
      - 'memory.add(type: pack-release)'
      - memory.submit            # draft → validating
    produces:
      - "docs/memory/pack-release/{id}.md"
      - "packs/**/CHANGELOG.md"
    checks:
      post: ["frontmatter.required: [pack, version, bump, wingfoil]"]
  - name: validate
    description: >-
      The compatibility matrix (pack-compatibility): compose every preset and every documented
      combination that includes the pack, with the oldest and the newest released WingFoil that
      compat.yaml lists as compatible; each must validate with zero errors, and two compositions
      must be byte-identical. npm run check:runs exits 0 on the same two releases, with a scenario
      that starts every main the pack ships (or one reaching its workflows); for a pack whose README
      carries install steps, the adoption run on a composition that holds the pack, once per init
      template, as pack-compatibility requires (dl-032 E3). The clean-clone checks run by npm run
      check:release from the submitted head; its report, written outside the repository, is read
      into the Validation, a failed run's report beside the rerun's (dl-054 P1).
      Record commands and exit codes in the Validation section. An independent review of the
      pack-release before the approver's gate (dl-017), its record (dl-017 R3) the verdict, the
      count per severity, the fixing commit and what was applied, or not and why.
    role: reviewer
    actions:
      - memory.submit            # validating → releasing
    checks:
      post: ["Validation section lists every WingFoil version and preset with exit code 0, and the check:runs and adoption runs with exit code 0 (dl-032 E3) and the check:release report with exit code 0 (dl-054 P1)"]
  - name: approve-publication
    description: >-
      The approver authorizes the publication (releasing → released) or sends it back; on
      approval, the approver pushes the approval commit (no tag); the agent reads main's CI on it
      and hands over the publication's commands only after its success (dl-053 P1).
    role: tech-lead
    actions:
      - memory.approve           # releasing → released (approver)
    approval: { by_role: approver }
    fallback: { step: validate, set_state: validating }
  - name: publish
    description: >-
      Tag <catalog pack id>@<version> at the release commit (dl-004, spec-001 §11); then, in one
      later commit, update catalog.yaml (version, commit, digest, formats, capabilities, computed
      WingFoil range) and regenerate CATALOG.md and catalog-index.json with npm run index
      (spec-002 §3); no file under packs/ changes. npm run publish:pack makes the tag and that
      catalog commit with the regenerated index (task-020). The approver runs npm run publish:pack
      with --report <path>, the path outside the repository, then the atomic push of the tag and the
      commit, from the commands the agent hands over; the agent reads the report into the
      pack-release's Publication and checks its digest and range against the publish:pack --dry-run
      the Validation recorded; a missing or different value stops the record and goes to the
      approver before CB-6 is read (dl-044 P1).
    role: tech-lead
    produces:
      - "catalog.yaml"
      - "CATALOG.md"
      - "catalog-index.json"
