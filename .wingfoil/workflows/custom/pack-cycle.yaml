# From a pack charter to the pack's first published version (sub-workflow, one iteration per pack).
# Pack machine (memory.yaml): draft → proposed (gate) → accepted → active. The pack is activated at
# its first tag, and its retrospective runs after (dl-033).
name: pack-cycle
kind: sub
description: "Charter, author and first-release one pack"
version: 6
element: pack
phases:
  - name: charter
    description: >-
      Write the pack charter (axis, slot, purpose, what it ships, requires/conflicts, formats and
      capabilities, dl-002); an independent review, amended while proposed (dl-017); submit it; the
      approver accepts it (proposed → accepted) or sends it back. A charter of a pack that ships
      workflows, or fills a slot of a required pack's workflow, records in its plan a run on the
      newest WingFoil release that compat.yaml lists before it is accepted: the pack's draft
      composed with the packs it requires and, for a slot they leave open, a fixture pack (as
      task-046's overlay), driven with WingFoil's workflow and memory commands through every phase
      it adds, at least once around each loop (an iterate_over with two candidates, each driven to
      the end of the iterated sub through every state it takes, in its where or out of it, and a
      candidate spanning two iterations of an enclosing loop, where the pack has one). By hand or
      with check:runs, recorded with commands and exit codes (pack-compatibility's evidence rule);
      its findings go to the charter while it is proposed (dl-032 E2).
    role: product-owner
    actions:
      - 'memory.add(type: pack)'
      - memory.submit            # draft → proposed
      - memory.approve           # proposed → accepted (approver)
    approval: { by_role: approver }
    produces:
      - "docs/memory/pack/{id}.md"
    checks:
      post: ["frontmatter.required: [title, axis, pack_path]"]
  - name: design
    description: >-
      Only when the pack introduces a new mechanism (a new fragment kind, a new parameter type, a
      transition): a tech-spec, or an amendment of spec-001, before any task is opened.
    role: architect
    optional: true
    actions:
      - 'memory.add(type: tech-spec)'
      - memory.submit
    approval: { by_role: approver }
  - name: author
    description: >-
      The pack's tasks, one kanban-delivery iteration each. The pack's exit criterion includes a run
      of its workflows, not only their validation: for a pack that ships a release workflow or
      fills delivery, a run through release to released at least once, with its methodology or the
      overlay's fixture methodology; by hand where check:runs cannot drive it (dl-032 E4). The
      scripted full run is a tooling task of its own (docs/owed-items.md).
    iterate_over: task
    where: { pack: "{pack.id}" }
    include: kanban-delivery
  - name: first-release
    description: "Publish the pack's first version, `1.0.0` or later (spec-001 §4)."
    include: pack-release-cycle
  - name: activate
    description: >-
      First version published: the pack becomes active (accepted → active) once its tag
      `<catalog pack id>@<version>` is on origin and `catalog.yaml` on origin/main lists that
      version.
    role: tech-lead
    actions:
      - memory.submit            # accepted → active
    checks:
      pre:
        - "the tag <catalog pack id>@<version> of this pack's first version is on origin"
        - "catalog.yaml on origin/main lists that version of this pack"
  - name: retrospective
    description: >-
      Learn from the pack's whole cycle, after its activation (dl-006 R1, read with dl-033 O1). One
      retrospective may cover several packs whose cycles ran together: the approver rules it in the
      plan that closes the last of them, and the plan that runs it names them. The phase stays
      required: a pack covered by a shared retrospective completes it with one Execution Note on its
      charter, added when that retrospective's decision-log is approved and citing it (dl-033 O2).
      The shared retrospective may also be the periodic one (dl-029).
    include: retrospective
