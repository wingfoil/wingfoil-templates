# Kanban delivery loop (sub-workflow), one iteration per `task` element of a pack. Included by
# pack-cycle › author. Tooling tasks (no pack) run through tooling-delivery, the same loop with the
# developer role (bug-001); the two files differ only in roles and descriptions.
# WIP limits: at most 1 task in-progress and 1 in-review per pack. Not enforced by WingFoil (no
# workflow engine): the plan phase checks them with
# `npx wingfoil memory search --type task --status in-progress`.
# Task machine (memory.yaml): draft → pending (gate) → backlog → in-progress → in-review (gate) →
# approved → done.
name: kanban-delivery
kind: sub
description: "Kanban delivery loop"
version: 5
element: task
phases:
  - name: plan
    description: >-
      Pick the next work within the WIP limits; create the task (pack, Context, Acceptance); an
      independent review of the body, amended while pending (dl-017); submit it; the approver
      accepts it into the backlog or rejects it.
    role: product-owner
    actions:
      - 'memory.add(type: task)'
      - memory.submit            # draft → pending
      - memory.approve           # pending → backlog (approver)
    approval: { by_role: approver }
  - name: design
    description: >-
      Write the Design section. An Acceptance criterion that cannot hold as written goes to the
      approver when found, and the work on it waits for the ruling (dl-019). Open branch
      task/<id>, start the task (backlog → in-progress).
    role: pack-author
    actions:
      - memory.submit            # backlog → in-progress
  - name: build
    description: >-
      Write the pack content (pack-authoring). An Acceptance criterion that cannot hold goes to the
      approver when found, and the work on it waits (dl-019). Every changed pack composes and
      validates with the pinned WingFoil CLI before review.
    role: pack-author
  - name: review
    description: >-
      An independent review of the build against the directives of the roles involved; the
      Acceptance commands pass; an Acceptance deviation with no ruling is a blocking finding
      (dl-019). After its fixes, a re-review when a fix changes behaviour, a test or an Acceptance
      command; the notes record each verdict, its findings by severity and the fixing commit
      (dl-017). Before in-review, dl-039's checks, in its order (R2): the build review and its
      amendments first; then, once, on the commit where the code is frozen, the branch CI's
      conclusion success (or, when a later push cancelled that run, the success of a later head
      whose diff from the frozen commit is documentation-only), each run id and its two jobs'
      durations recorded in the notes (a job over 25 minutes goes to the approver, dl-039 R3), and,
      from a clean working tree on that commit, on Node.js 22.21.0 after npm ci and npm run build,
      npm run validate:publication, the golden tree in publication mode (npm run
      validate:publication -- --tree tests/fixtures/compose/tree --param project_name=Golden) and
      npm run -s wingfoil -- workflow list, each exit 0 (R1); a content-only task (a feedback note)
      included. A clean clone with an empty .cache only for a change to how the matrix installs or
      initialises a release (src/matrix.ts) with unchanged lockfiles, or at the approver's request.
      A documentation-only commit after the checks (docs/memory, docs/plans) needs no new run, said
      in the notes; while the local checks run, a reviewer runs only targeted tests; a red branch CI
      is a finding of the build, fixed and checked again. Then in-progress → in-review; the approver
      accepts (→ approved) or sends it back (→ in-progress).
    role: reviewer
    actions:
      - memory.submit            # in-progress → in-review
      - memory.approve           # in-review → approved (approver)
    approval: { by_role: approver }
    fallback: { step: build, set_state: in-progress }
  - name: deliver
    description: "Merge task/<id> into main with --no-ff, then approved → done."
    role: pack-author
    actions:
      - memory.submit            # approved → done
