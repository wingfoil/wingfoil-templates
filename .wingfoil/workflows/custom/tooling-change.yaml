# Startable entry point to change the repository tooling (composer, validator, CI) after the
# sw-life-cycle `tooling` phase has run (dl-005 G7). Same loop as that phase: one tooling-delivery
# iteration per task with no pack. Mirrors pack-release, which reopens a pack after pack-cycle.
name: tooling-change
kind: main
description: "Change the repository tooling, one tooling-delivery iteration per tooling task"
version: 2
phases:
  - name: deliver
    description: "One tooling-delivery iteration per tooling task (a task whose `pack` is empty)."
    iterate_over: task
    where: { pack: "" }
    include: tooling-delivery
