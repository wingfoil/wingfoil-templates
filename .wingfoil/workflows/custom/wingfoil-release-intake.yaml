# Startable when WingFoil publishes a release.
# Keeps compat.yaml true and tells which packs a new format or capability affects (dl-002; brought
# back by the journeys review, dl-005 G8). Its close starts the periodic retrospective (dl-029).
name: wingfoil-release-intake
kind: main
description: "Record a new WingFoil release in compat.yaml, re-check the active packs and start the periodic retrospective (dl-029)"
version: 5
phases:
  - name: record
    description: >-
      Add the release to compat.yaml: the format versions it reads, from the format: keys its files
      accept and its CHANGELOG, and the capabilities it provides, recorded only when its CHANGELOG
      names the feature or command behind one (dl-021 R4). A new format kind enters kinds here; a
      new capability enters the provisional vocabulary (spec-001 §12), WingFoil owning the final
      names (WingFoil dl-177). Commit
      src/matrix/wingfoil-<version>/package.json, pinning wingfoil to exactly that version, and its
      lockfile (npm install --package-lock-only --ignore-scripts in that folder), so that the
      compatibility matrix can install the release (task-011); npm run check:pins checks them, and
      npm audit reports 0 vulnerabilities on the new lockfile. Then recompute the wingfoil field of
      every published version in catalog.yaml (spec-001 §12), and regenerate CATALOG.md and
      catalog-index.json with npm run index (spec-002 §3).
    role: tech-lead
    produces:
      - "compat.yaml"
      - "src/matrix/wingfoil-*/package.json"
      - "src/matrix/wingfoil-*/package-lock.json"
      - "catalog.yaml"
      - "CATALOG.md"
      - "catalog-index.json"
    approval: { by_role: approver }
  - name: recheck
    description: >-
      Run the compatibility matrix of every active pack against the new release. The computed
      range of every published version was already recomputed at intake by record (spec-001 §12);
      this phase checks the active packs on the release that range now includes.
    role: reviewer
  - name: plan-migrations
    description: >-
      For each pack whose formats the new release no longer reads, or that can now use a new format
      or capability: open a task (kanban-delivery). Before WingFoil 1.0 the living line moves to the
      new format; after 1.0 the previous line becomes the N-1 maintenance line (pack-semver).
    role: product-owner
    optional: true
    actions:
      - 'memory.add(type: task)'
  - name: retrospective-start
    description: >-
      At the intake's close (dl-029 T1, T2). The intake's plan records WingFoil's next release
      planning date as announced, or "not known". It then starts a periodic retrospective, unless a
      periodic retrospective, or a pack-cycle retrospective whose inventory has the scope
      "periodic", has closed since the release this intake takes in, or the approver rules in the
      intake's plan that a release WingFoil holds no planning of its own for (a patch) starts none.
      On the 0.2.2 pin "starts" means the facilitator adds the retrospective's plan
      (workflow: retrospective-periodic, workflow and phase filled by editing the draft, W-02). The
      intake's plan records the retrospective that covers the window and its deadline: before
      WingFoil's next release planning, or, when the date is not known, within seven days of the
      intake's close, which the approver may tighten in the intake's plan; a retrospective that
      covers a patch's window too closes before WingFoil's next release planning.
    role: facilitator
