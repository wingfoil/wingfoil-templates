# Startable when WingFoil publishes a release, or when intake.yml's report names one (plan-065).
# Keeps compat.yaml true and tells which packs a new format or capability affects (dl-002; brought
# back by the journeys review, dl-005 G8). Its close starts the periodic retrospective (dl-029), with
# its deadline when WingFoil's release planning has started (dl-040). A patch that intake.yml
# reports verified takes the artifact it prepared; a guided report, the hand-run phases (dl-042).
name: wingfoil-release-intake
kind: main
description: "Record a new WingFoil release in compat.yaml, re-check the active packs and start the periodic retrospective (dl-029)"
version: 7
phases:
  - name: record
    description: >-
      Which path, from intake.yml's report on the release (dl-042 I1). Several missing versions:
      one intake per version, in ascending order, intake.yml preparing only the lowest missing one,
      each prepared only after the one before is merged. A verified report (a patch): the intake's
      plan cites the run id of the report it acts on; on a task branch of the intake (as task-059
      and task-074), claude applies the run's artifact with npm run intake:apply -- <dir> --version
      <version>, which checks each file's sha256, the allowlist and the base (main's head, or no
      allowlisted file changed on main since; otherwise intake.yml is run again), and never
      regenerates the lockfile; then writes the row's notes sentence in place of intake:prepare's
      placeholder, in compat.yaml and the golden fixture's (dl-042 I3); the row's capabilities and
      reads are its predecessor's, carried forward (dl-042 I2). A sha256 mismatch, a moved base, an
      expired artifact, a new advisory, a red branch CI or a rehearsal report makes the intake
      guided, or intake.yml is run again. A verified report is a proposal, never a record. A guided
      report, or none: as follows, the report (the CHANGELOG section as a checklist, the checks,
      the packs each kind it names touches) the phases' input, the directives each item touches
      worked out by the guided intake (no mechanical mapping exists, task-081).
      Add the release to compat.yaml: the format versions it reads, from the format: keys its files
      accept and its CHANGELOG, and the capabilities it provides, recorded only when its CHANGELOG
      names the feature or command behind one (dl-021 R4). A new format kind enters kinds here; a
      new capability enters the provisional vocabulary (spec-001 §12), WingFoil owning the final
      names (WingFoil dl-177). Commit
      src/matrix/wingfoil-<version>/package.json, pinning wingfoil to exactly that version, and its
      lockfile (npm install --package-lock-only --ignore-scripts in that folder), so that the
      compatibility matrix can install the release (task-011); npm run check:pins checks them, and
      npm audit reports 0 vulnerabilities on the new lockfile. Then recompute the wingfoil field of
      every published version in catalog.yaml (spec-001 §12), and regenerate CATALOG.md and
      catalog-index.json with npm run index (spec-002 §3); npm run intake:prepare -- <version>
      writes this mechanical part, a guided intake writing the notes and any change the report
      lists, and checking the capabilities and reads it carries forward against the CHANGELOG
      (dl-021 R4). The release's facts are in its notes (dl-042 I3): spec-001 §12 points to
      compat.yaml and gets no prose per release, and dl-009 no Execution Note per release.
    role: tech-lead
    produces:
      - "compat.yaml"
      - "src/matrix/wingfoil-*/package.json"
      - "src/matrix/wingfoil-*/package-lock.json"
      - "catalog.yaml"
      - "CATALOG.md"
      - "catalog-index.json"
    approval: { by_role: approver }
  - name: recheck
    description: >-
      For a verified patch, cite the report's checks on the new release (intake.yml's verify jobs,
      each check by Node.js version) and the task branch's CI (dl-039); nothing is run again by
      hand. Otherwise run the compatibility matrix of every active pack against the new release.
      The computed range of every published version was already recomputed at intake by record
      (spec-001 §12); this phase checks every active pack on the new release, which that range now
      includes where the pack's formats and capabilities allow.
    role: reviewer
  - name: plan-migrations
    description: >-
      Empty for a verified patch, by the bar of "verified" (dl-042 I1). For each pack whose formats
      the new release no longer reads, or that can now use a new format or capability: open a task
      (kanban-delivery). Before WingFoil 1.0 the living line moves to the new format; after 1.0
      the previous line becomes the N-1 maintenance line (pack-semver).
    role: product-owner
    optional: true
    actions:
      - 'memory.add(type: task)'
  - name: retrospective-start
    description: >-
      At the intake's close (dl-029 T1, T2; dl-040). The intake's plan records WingFoil's next
      release planning date as announced or reported by the approver, or "not known". It then starts
      a periodic retrospective, unless a periodic retrospective, or a pack-cycle retrospective whose
      inventory has the scope "periodic", has closed since the release this intake takes in, or the
      approver rules in the intake's plan that a release WingFoil holds no planning of its own for
      (a patch) starts none. A verified patch takes that patch case by default, with no ruling, only
      while a retrospective covering its window is open (started, not closed), for at most three
      patches, verified or guided, after the intake that started it (that intake's release not
      counted) or 14 days after its close, whichever comes first, never extending that
      retrospective's deadline (T2's seven days when the planning date is not known; dl-040 D1 … D3;
      dl-042 I4); a guided patch counts toward the three unless its intake starts a retrospective,
      which restarts the count, and one for which the approver rules the patch case counts as one.
      Even by default the intake's plan records the planning date, the covering retrospective, its
      deadline and the count reached; past either bound, or for a guided report, the approver rules
      in the intake's plan. On the 0.2.2 pin "starts" means the facilitator adds the retrospective's
      plan (workflow: retrospective-periodic, workflow and phase filled by editing the draft, W-02).
      The intake's plan records the retrospective that covers the window and its deadline: before
      WingFoil's next release planning, or, when the date is not known, within seven days of the
      intake's close, which the approver may tighten in the intake's plan; a retrospective that
      covers a patch's window too closes before WingFoil's next release planning. When WingFoil's
      next release planning has started and not ended before the intake closes, or starts before the
      retrospective closes while its date was recorded at the intake's close as "not known" (or
      announced later than it turned out), the intake's plan (or the retrospective's, from the day
      the start is announced or reported) records its start date as announced or reported, and the
      deadline is: the WingFoil-side notes on main as soon as possible while the planning runs, the
      notes task, if any, merging into main alone, ahead of the retrospective's branch; the
      retrospective closed within seven days of the intake's close. A retrospective that covers a
      patch's window too follows the same rule, its seven days counted from the close of the intake
      that started it. A date announced at the intake's close and then missed: the approver rules in
      the plan (dl-040 D1). The notes task merging alone starts from main, on its own branch, added
      with memory add there and no other task added on any branch meanwhile (W-14); its body cites
      the inventory by path and date, the cross-references added at the retrospective's close; it
      merges on the approver's OK (dl-040 D2). When the planning has already ended before the intake
      closes, the following planning is the "next" one: the retrospective closes before it, or
      within seven days when its date is not known, and its notes reach main with the
      retrospective's close (dl-040 D3).
    role: facilitator
