format: 1
version: 1
defaults:
  states:
    sequence:
      - draft
      - pending
      - approved
      - archived
    gates:
      pending:
        reject: draft
types:
  task:
    path: docs/memory/task/{id}.md
    id_pattern: task-{n}-{slug}
    template:
      file: memory/templates/built-in/task.md
      frontmatter:
        required:
          - id
          - title
    states:
      sequence:
        - draft
        - pending
        - backlog
        - ready
        - in-progress
        - in-review
        - qa
        - approved
        - done
      gates:
        pending:
          reject: draft
        in-review:
          reject: in-progress
        ready:
          reject: backlog
  adr:
    path: docs/memory/adr/{id}.md
    id_pattern: adr-{n}-{slug}
    template:
      file: memory/templates/built-in/adr.md
      frontmatter:
        required:
          - id
          - title
  release:
    path: docs/memory/release/{id}.md
    id_pattern: rel-{version}
    template:
      file: memory/templates/built-in/release.md
      frontmatter:
        required:
          - id
          - title
          - version
  endpoint:
    path: docs/endpoints/{id}.md
    id_pattern: ep-{n}-{slug}
    template:
      file: memory/templates/built-in/endpoint.md
      frontmatter:
        required:
          - id
          - title
