# The scripted run of software's workflows on WingFoil (task-058, plan-051; task-109), run by
# `npm run check:runs` and the CI on every branch push, on each selected release. Each run starts
# one main of software in its own scratch repository holding a README example's composition,
# committed; the agent below runs it (fixture data, no governance act).
format: 1
compositions: tests/fixtures/examples/software
identities:
  agent: { name: "Runs Agent", email: "agent@runs.invalid" }
runs:
  - main: sw-life-cycle
    steps: [start]
  # The optional fields of software's adr, bug and tech-spec templates (task-109): one element of
  # each added; a release needs version and release-line, which the runner's add does not set.
  - main: adr-ingest
    name: software-templates
    steps:
      - start
      - add: { type: adr, title: "Store amounts as integers", step: adr-ingest.capture }
      - add: { type: bug, title: "The total rounds down" }
      - add: { type: tech-spec, title: "The ledger export" }
