format: 1
id: release-folders-lean
title: "Release folders, lean"
description: >-
  Otter Ledger, a fictional bookkeeping app, files its records by release under docs/04_memory/ and
  works in one-week Sprints.
packs:
  - software@^1
  - methodology/scrum@^1
parameters:
  project_name: "Otter Ledger"
  approver_name: "Otter Lead"
  approver_email: "lead@otter-ledger.example"
  agent_name: "Otter Agent"
  decision_log_path: "docs/04_memory/design/dls/{id}.md"
  task_path: "docs/04_memory/{release}/{id}.md"
  plan_path: "docs/05_plans/{scope}/{id}.md"
  plan_id: "{workflow}-{phase}-plan"
  adr_path: "docs/04_memory/design/adrs/{id}.md"
  tech_spec_path: "docs/04_memory/design/specs/{id}.md"
  bug_path: "docs/04_memory/bugs/{id}.md"
  release_line_path: "docs/04_memory/planning/{id}.md"
  release_path: "docs/04_memory/planning/{release-line}/{id}.md"
  release_id: "{kind}-{version}"
  sprint_length: "1 week"
  sprint_path: "docs/04_memory/sprints/{id}.md"
