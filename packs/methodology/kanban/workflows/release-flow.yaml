format: 1
# One release of methodology/kanban: its work items, then the release slot over this release, then
# base's retrospective.
name: release-flow
kind: sub
element: release
description: "One release: its work items, the release, the retrospective"
version: 1
phases:
  - name: work
    description: >-
      Each work item whose release field holds this release's version, pulled within the WIP
      limits. A task joins when it reaches backlog with that release and leaves at done; a task
      moved to the next release (its release field rewritten) goes on there.
    iterate_over: task
    where: { status: [backlog, in-progress, in-review, approved], release: "{release.version}" }
    include: work-item
  - name: release
    description: >-
      The release slot over this release. Move the release to releasing only once its own tasks
      are done or moved to the next release: when a release completes, its tasks still open are
      reported late.
    iterate_over: release
    where: { status: [in-development, releasing], version: "{release.version}" }
    include: release
  - name: retrospective
    description: >-
      base's retrospective for this release: the facilitator writes the release's own file under
      the retrospective path and improves the workflow.
    include: retrospective
