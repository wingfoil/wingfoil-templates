format: 1
# The flow of methodology/kanban, release by release (software's delivery slot). Releases are the one
# stream of this workflow; the work items nest in each release (release-flow).
name: delivery
kind: sub
description: "The flow, release by release"
version: 1
phases:
  - name: plan-release
    description: >-
      The Product Owner adds the first open release and moves it to in-development (two submits):
      its version and release-line given with --set or written in the draft. Later releases are
      added outside a step with memory add and moved the same way; keep one release in-development
      to carry the flow, and add the next before the current one leaves in-development.
    role: product-owner
    actions:
      - 'memory.add(type: release)'
      - memory.submit
      - memory.submit
    produces:
      - { type: release, path: "{{release_path}}" }
  - name: releases
    description: >-
      Each open release, with the work items it carries, its release and its retrospective. A
      release already released when the project adopted is never selected.
    iterate_over: release
    where: { status: [in-development, releasing] }
    include: release-flow
