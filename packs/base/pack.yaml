format: 1
id: base
name: base
title: "Base"
description: >-
  The core of every project governed by WingFoil, software or not: the Memory types, workflows,
  directives and DNA that all of them use, and nothing that only some use.
version: 1.0.0
formats:
  dna: 1
  roles: 1
  memory: 1
  workflow: 1
  directive: 1
  memory-template: 1
requires_capabilities: [workflow-engine]
parameters:
  project_name: { type: string, description: "The project's name: dna.yaml project.name" }
  approver_name:
    type: string
    description: "The name of the approver, the team member who approves"
  approver_email:
    type: string
    description: "The approver's email, which WingFoil matches to the git user to grant approval"
  agent_name: { type: string, description: "The name of the agent in dna.yaml team.agents" }
  decision_log_path:
    type: path
    default: "docs/memory/decision-log/{id}.md"
    description: "The decision-log type's path; only letters, digits and . _ / { } -"
  task_path:
    type: path
    default: "docs/memory/task/{id}.md"
    description: "The task type's path; only letters, digits and . _ / { } -"
  plan_path:
    type: path
    default: "docs/plans/{id}.md"
    description: "The plan type's path; only letters, digits and . _ / { } -"
  plan_id:
    type: pattern
    default: "{workflow}-{phase}-plan"
    description: >-
      The plan type's id pattern. WingFoil's workflow start fills a started plan's workflow and
      phase only from the tokens the id pattern or the path declares; a pattern without {workflow}
      and {phase} leaves them to be filled by hand
  retrospective_path:
    type: path
    default: "docs/retrospectives/"
    description: >-
      Where the retrospective's friction inventory goes: a directory, ending with /, by default
      (weak evidence: any file in it); a project may set a fixed file, with no trailing /. Only
      letters, digits and . _ / { } -, and no {...} token, since no element is in scope
contents:
  fragments: [dna, roles, memory]
  directives: [traceability, doc-versioning, security-secrets, claim-sources]
  workflows: [decision-log-ingest, governance-evolution, retrospective, retrospective-periodic]
  memory_templates: [decision-log, task, plan]
  agents_section: true
