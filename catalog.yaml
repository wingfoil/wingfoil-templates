# The index WingFoil reads to list, resolve and verify packs (spec-001 §11).
# axes and slots are spec-001 §3 and §9 as data; the order of axes is the composition order (§7.1).
# Packs are listed when their first version is published (pack-release-cycle, publish); until then
# the lists are empty (dl-010).
format: 1
foundation: [base, software]
axes:
  methodology: { cardinality: one, required_with: software }
  phase:       { cardinality: one-per-slot, required: false, slots: [inception, specification, release, end-of-life] }
  blueprint:   { cardinality: many, required: false }
  governance:  { cardinality: many, required: false }
  team-mode:   { cardinality: one, required: false, overlay: true }
  stage:       { cardinality: one, required: false, overlay: true, scale: [prototype, mvp, production, maintenance, sunset] }
slots:
  inception:     { included_by: sw-life-cycle, default: software, filled_by: phase }
  specification: { included_by: sw-life-cycle, default: software, filled_by: phase }
  delivery:      { included_by: sw-life-cycle, filled_by: methodology }
  release:       { included_by: delivery, default: software, filled_by: phase }
  end-of-life:   { included_by: sw-life-cycle, default: software, filled_by: phase }
packs:
  - id: base
    path: packs/base
    catalog: official
    status: active
    versions:
      - version: 1.0.0
        commit: 3f34dfc95eea315444d74cc9424de61071c93163
        digest: sha256:ff23044b700fcf85c04250b1e44761248950187f5ac3d6e89bcda62b4b4e70be
        formats:
          dna: 1
          roles: 1
          memory: 1
          workflow: 1
          directive: 1
          memory-template: 1
        requires_capabilities:
          - workflow-engine
        requires: []
        conflicts: []
        wingfoil: 0.3.0
      - version: 2.0.0
        commit: 6d04472f0694e6238ca73fb65dd730245187d329
        digest: sha256:9cad63f17b1ffee435cf1a6d6b32a1a0ddb8b0ff746a51351f3a2147d33fc9ff
        formats:
          dna: 1
          roles: 1
          memory: 1
          workflow: 1
          directive: 1
          memory-template: 1
        requires_capabilities:
          - workflow-engine
        requires: []
        conflicts: []
        wingfoil: 0.3.0
transitions: []
presets: []
